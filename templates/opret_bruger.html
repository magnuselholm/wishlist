{% extends "base.html" %}

{% block titel %}Opret bruger{% endblock %}

{% block indhold %}
<section class="kort smal">
    <h1>Opret bruger</h1>
    <form method="POST" action="{{ url_for('auth.opret') }}" class="lodret">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

        <label for="navn">Navn</label>
        <input type="text" id="navn" name="navn" value="{{ navn or '' }}" required autofocus>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="adgangskode">Adgangskode</label>
        <input type="password" id="adgangskode" name="adgangskode" minlength="8" required>
        <small>Mindst 8 tegn.</small>

        <label for="adgangskode_igen">Gentag adgangskode</label>
        <input type="password" id="adgangskode_igen" name="adgangskode_igen" minlength="8" required>

        <button type="submit" class="knap">Opret bruger</button>
    </form>
    <p class="under">Har du allerede en bruger? <a href="{{ url_for('auth.login') }}">Log ind</a>.</p>
</section>
{% endblock %}
